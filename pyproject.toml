[project]
name = "hass-ops"
version = "0.1.0"
description = "Operate a Home Assistant instance as code: gated deploys, tier-2 state (registries, dashboards) pulled, planned and applied from files, drift detection."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "pyyaml>=6",
    "ruamel.yaml>=0.18",
    "websockets>=13",
]

[project.scripts]
hass-ops = "hass_ops.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hass_ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
